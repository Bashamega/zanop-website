name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  html-and-formatting:
    name: Valid HTML and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML
        run: npx --yes html-validate@10.4.0 "**/*.html"

      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check "**/*.{css,js}"
