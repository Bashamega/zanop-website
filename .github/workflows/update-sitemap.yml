name: Update sitemap

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        run: python3 scripts/update_sitemap.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: $GITHUB_TOKEN
        run: |
          branch="chore/update-sitemap-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add sitemap.xml
          git commit -m "chore: update sitemap"
          git push origin "HEAD:$branch"

          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update sitemap" \
            --body "This pull request automatically updates \`sitemap.xml\` with the site's current HTML pages and their Git commit timestamps."
